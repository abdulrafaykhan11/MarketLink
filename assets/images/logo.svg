<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 60" width="240" height="60" fill="none">
  <defs>
    <linearGradient id="mlGreenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#22c55e" />
      <stop offset="50%" stop-color="#16a34a" />
      <stop offset="100%" stop-color="#15803d" />
    </linearGradient>
    <linearGradient id="mlGoldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#ca8a04" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Icon Symbol: Interlinked Fresh Leaf & Community Node -->
  <g transform="translate(6, 6)">
    <!-- Ambient back circle -->
    <circle cx="24" cy="24" r="22" fill="#15803d" fill-opacity="0.12" stroke="url(#mlGreenGrad)" stroke-width="1.5"/>
    
    <!-- Dynamic Market Link Symbol: Leaf with link loops -->
    <path d="M24 10 C18 10, 13 15, 13 22 C13 29, 21 37, 24 38 C27 37, 35 29, 35 22 C35 15, 30 10, 24 10 Z" 
          fill="url(#mlGreenGrad)" filter="url(#glow)"/>
    <path d="M24 16 L24 32" stroke="#ffffff" stroke-width="2" stroke-linecap="round"/>
    <path d="M19 23 L24 20 L29 25" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Gold Harvest accent dot -->
    <circle cx="24" cy="13" r="3" fill="url(#mlGoldGrad)"/>
  </g>

  <!-- Typography: MarketLink -->
  <text x="64" y="37" font-family="'Plus Jakarta Sans', 'Inter', -apple-system, sans-serif" font-size="24" font-weight="800" fill="#0f172a" letter-spacing="-0.5px">
    Market<tspan fill="#16a34a">Link</tspan>
  </text>
  <text x="65" y="49" font-family="'Inter', sans-serif" font-size="9" font-weight="600" fill="#64748b" letter-spacing="1.8px" text-transform="uppercase">
    Direct Farmers Market
  </text>
</svg>
