<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 48 48" width="48" height="48" fill="none">
  <defs>
    <!-- Organic Vibrant Leaf Gradient -->
    <linearGradient id="farmGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="50%" stop-color="#34d399" />
      <stop offset="100%" stop-color="#6ee7b7" />
    </linearGradient>

    <!-- AI Intelligence Golden Sparkle Gradient -->
    <linearGradient id="sparkleGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a" />
      <stop offset="50%" stop-color="#facc15" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>

    <!-- Ambient Shadow Filter -->
    <filter id="aiDropShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="2.5" flood-color="#000000" flood-opacity="0.25"/>
    </filter>
  </defs>

  <!-- Ambient Glow Ring -->
  <circle cx="24" cy="24" r="22" fill="#ffffff" fill-opacity="0.12" />

  <!-- Main Farm Sprout & Leaf Shape -->
  <g filter="url(#aiDropShadow)">
    <!-- Base Stem -->
    <path d="M16 38C18 31 23 25 30 21" stroke="#ffffff" stroke-width="3" stroke-linecap="round"/>

    <!-- Primary Lush Harvest Leaf -->
    <path d="M16 36C15 27 21 17 33 13C33 13 34.5 22.5 28.5 29C23.5 34.5 18 36 16 36Z" fill="#ffffff"/>
    
    <!-- Inner Leaf Vein Line -->
    <path d="M19 33C22.5 28.5 26 23 31.5 16.5" stroke="#059669" stroke-width="2" stroke-linecap="round"/>

    <!-- Left Sprout Shoot Leaf -->
    <path d="M17 30C12 26.5 11.5 19.5 17 16C19.5 21.5 19 27.5 17 30Z" fill="url(#farmGrad)"/>
    <path d="M15 27C14.5 23 15.5 19 16.5 17.5" stroke="#047857" stroke-width="1.4" stroke-linecap="round"/>
  </g>

  <!-- AI Gemini Diamond Sparkles (Signifying Artificial Intelligence) -->
  <!-- Top Right Master Sparkle -->
  <g filter="url(#aiDropShadow)">
    <path d="M36 6C36 10 39.5 12 43 13C39.5 14 36 16 36 20C36 16 32.5 14 29 13C32.5 12 36 10 36 6Z" fill="url(#sparkleGrad)"/>
    <circle cx="36" cy="13" r="1.5" fill="#ffffff"/>
  </g>

  <!-- Top Left Secondary Sparkle -->
  <g filter="url(#aiDropShadow)">
    <path d="M10 9C10 11.5 11.8 12.8 14 13.5C11.8 14.2 10 15.5 10 18C10 15.5 8.2 14.2 6 13.5C8.2 12.8 10 11.5 10 9Z" fill="url(#sparkleGrad)"/>
    <circle cx="10" cy="13.5" r="1" fill="#ffffff"/>
  </g>

  <!-- Bottom Accent Sparkle Dot -->
  <circle cx="39" cy="27" r="2" fill="url(#sparkleGrad)"/>
</svg>
